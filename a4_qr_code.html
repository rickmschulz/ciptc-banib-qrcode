<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A4 Poster Mockup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            /* Fundo cinza para destacar a folha branca */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0; 
            padding: 20px;
        }

        /* Dimensões Proporcionais da Folha A4 */
        .a4-container {
            width: 100%;
            max-width: 794px;
            /* Largura A4 em 96 DPI */
            height: 1123px;
            /* Altura A4 em 96 DPI */
            background-color: #ffffff;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }

        /* Configurações exatas para Impressão */
        @media print {
            @page {
                size: A4;
                margin: 0mm;
                /* Remove as margens do navegador */
            }

            body {
                background-color: #ffffff !important;
                padding: 0 !important;
                margin: 0 !important;
                display: block !important;
                /* Remove o flexbox que centraliza na tela */
            }

            .a4-container {
                box-shadow: none !important;
                /* Tira a sombra */
                width: 100% !important;
                max-width: 100% !important;
                height: 100% !important;
                /* Ajusta a altura exata da folha física */
                margin: 0 !important;
                page-break-after: avoid;
                page-break-before: avoid;
            }

            /* Força o navegador a imprimir o fundo escuro do cabeçalho e a borda amarela */
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
    </style>
    <script src="config.js"></script>
</head>

<body>

    <div class="a4-container">

        <header class="bg-slate-900 text-white border-b-8 border-yellow-500 w-full px-6 py-8 shadow-md">
            <div class="flex items-center justify-between">
                <!-- Logo Governo e Título -->
                <div class="flex items-center space-x-6">
                    <img id="logo-gov" src="" alt="" title=""
                        class="h-16 md:h-20 w-auto object-contain -ml-4">
                    <div>
                        <h1 id="header-title"
                            class="text-xl md:text-xl font-bold leading-tight uppercase max-w-[380px]"></h1>
                    </div>
                </div>
                <!-- Logo Parceiro -->
                <div class="flex items-center flex-shrink-0 ml-4">
                    <img id="logo-partner" src="" alt="" title=""
                        class="h-12 md:h-16 w-auto object-contain">
                </div>
            </div>
        </header>

        <div class="flex flex-col flex-grow justify-between p-12">

            <main class="flex flex-col items-center justify-center flex-grow py-4">

                <h3 id="main-heading"
                    class="text-4xl font-extrabold text-slate-800 mb-12 text-center uppercase tracking-wide"></h3>

                <!-- Container do QR Code -->
                <div
                    class="p-6 bg-white rounded-3xl shadow-2xl border border-gray-200 flex justify-center items-center">
                    <img id="qr-code" src="" alt="QR Code do Tour Virtual">
                </div>

                <!-- Call to action com instrução clara -->
                <div class="mt-12 flex flex-col items-center">
                    <p id="call-to-action"
                        class="text-xl text-slate-800 font-semibold bg-slate-100 px-8 py-4 rounded-full border border-slate-300 shadow-sm flex items-center gap-3">
                    </p>
                </div>

            </main>

            <footer class="text-center pb-6 mt-4">
                <p id="alt-link-url"
                    class="text-2xl font-mono font-bold text-slate-900 bg-slate-100 px-6 py-4 rounded-lg border border-slate-300 inline-block shadow-inner">
                </p>
                <!-- Data baseada na URL para controle de versão do cartaz -->
                <p id="update-date" class="text-base text-gray-400 mt-8 font-medium"></p>
            </footer>

        </div>
    </div>

    <script>
        // ── Popula o DOM a partir de posterConfig ──────────────────
        (function () {
            const c = posterConfig;

            // Cabeçalho
            const logoGov = document.getElementById("logo-gov");
            logoGov.src = c.header.logoGov.src;
            logoGov.alt = c.header.logoGov.alt;
            logoGov.title = c.header.logoGov.title;

            const logoPartner = document.getElementById("logo-partner");
            logoPartner.src = c.header.logoPartner.src;
            logoPartner.alt = c.header.logoPartner.alt;
            logoPartner.title = c.header.logoPartner.title;

            document.getElementById("header-title").textContent = c.header.title;

            // Conteúdo principal
            document.getElementById("main-heading").textContent = c.main.heading;

            const qr = document.getElementById("qr-code");
            const qrSize = c.qrCode.size;
            qr.src = `${c.qrCode.apiBase}?size=${qrSize}x${qrSize}&data=${encodeURIComponent(c.qrCode.targetUrl)}`;
            qr.style.width = qrSize + "px";
            qr.style.height = qrSize + "px";

            document.getElementById("call-to-action").innerHTML =
                `<span class="text-2xl">${c.main.callToActionEmoji}</span> ${c.main.callToAction}`;

            // Rodapé
            document.getElementById("alt-link-url").textContent = c.footer.altLinkUrl;
            document.getElementById("update-date").textContent = "Atualização: " + c.footer.updateDate;
        })();
    </script>

</body>
</html>
